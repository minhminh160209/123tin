<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ôn Tin 12">
<title>Ôn Tập Tin Học 12 - GK1</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#333;--h:#2c3e50;--sub:#555;--grp:#eef2f5;--opt:#ecf0f1;--btn:#bdc3c7;--prog:#7f8c8d;--warn:#fff3cd;--warntx:#333;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121618;--card:#1e2427;--tx:#e6e9ea;--h:#e6edf2;--sub:#aab4ba;--grp:#2a3236;--opt:#2a3236;--btn:#4a555b;--prog:#9aa5ab;--warn:#3a3420;--warntx:#eee}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121618;--card:#1e2427;--tx:#e6e9ea;--h:#e6edf2;--sub:#aab4ba;--grp:#2a3236;--opt:#2a3236;--btn:#4a555b;--prog:#9aa5ab;--warn:#3a3420;--warntx:#eee}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);margin:0;padding:12px;color:var(--tx)}
.container{max-width:600px;margin:auto;background:var(--card);padding:18px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.1)}
h1{text-align:center;color:var(--h);font-size:22px;margin-top:0}
.lesson-checkbox{display:flex;align-items:center;margin-bottom:8px;padding:10px;background:var(--grp);border-radius:8px;font-size:16px}
.lesson-checkbox input{width:22px;height:22px;margin-right:10px;flex-shrink:0}
.main-btn,.next-btn{width:100%;padding:15px;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
.main-btn{background:#3498db}.next-btn{background:#f39c12;display:none}
.progress{text-align:right;color:var(--prog);font-size:14px;margin-bottom:10px;font-weight:bold}
.question-text{font-size:17px;font-weight:bold;margin-bottom:15px;line-height:1.5}
.option{display:block;width:100%;padding:12px;margin-bottom:10px;background:var(--opt);color:var(--tx);border:2px solid transparent;border-radius:8px;text-align:left;font-size:16px;line-height:1.4;cursor:pointer;font-family:inherit}
.option.correct{background:#d4edda;border-color:#28a745;color:#155724;font-weight:bold}
.option.wrong{background:#f8d7da;border-color:#dc3545;color:#721c24;font-weight:bold}
.tf-row{padding:12px;background:var(--opt);border-radius:8px;margin-bottom:10px;font-size:15px}
.tf-text{line-height:1.45;margin-bottom:10px}
.tf-btns{display:flex;gap:8px}
.tf-btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;background:var(--btn);color:var(--tx);font-size:15px}
.tf-btn.selected-true{background:#28a745;color:#fff}.tf-btn.selected-false{background:#dc3545;color:#fff}
.tf-btn:disabled{cursor:default;opacity:.75}
.score-box{text-align:center;font-size:24px;color:#e74c3c;font-weight:bold;margin:20px 0}
.feedback{margin-top:10px;font-size:15px;font-weight:bold;text-align:center}
.wrong-item{margin-bottom:10px;padding:10px;background:var(--warn);color:var(--warntx);border-radius:6px;font-size:13px}
</style>
</head>
<body>

<div class="container" id="start-screen">
<h1>Ôn Tập Tin Học 12 - GK1</h1>
<p style="text-align:center;color:var(--sub)">Chọn bài bạn muốn ôn tập:</p>
<div id="lesson-list"></div>
<button class="main-btn" onclick="startQuiz()">Bắt Đầu Làm Bài</button>
</div>

<div class="container" id="quiz-screen" style="display:none">
<div class="progress" id="progress-text"></div>
<div class="question-text" id="question-text"></div>
<div id="question-body"></div>
<div class="feedback" id="feedback"></div>
<button class="next-btn" id="next-btn" onclick="nextQuestion()">Câu Tiếp Theo</button>
</div>

<div class="container" id="result-screen" style="display:none">
<h1>Kết Quả Ôn Tập</h1>
<div class="score-box" id="final-score"></div>
<div id="detailed-results" style="max-height:50vh;overflow-y:auto;font-size:14px;margin-bottom:20px"></div>
<button class="main-btn" onclick="location.reload()">Làm Lại Từ Đầu</button>
</div>

<script>
const allQuestions = [
// ===== BÀI 1 =====
{l:"Bài 1", type:"mc", q:"AI (Trí tuệ nhân tạo) là gì?", o:["Hệ thống tự động","Khả năng của máy tính thực hiện các công việc mang tính trí tuệ của con người","Phần mềm diệt virus","Ứng dụng điện thoại thông minh"], a:1},
{l:"Bài 1", type:"mc", q:"Mục đích chính của AI là gì?", o:["Xây dựng các phần mềm diệt virus","Xây dựng các phần mềm giúp máy tính có năng lực trí tuệ tương tự con người","Tạo ra các ứng dụng giải trí","Phát triển các trò chơi điện tử"], a:1},
{l:"Bài 1", type:"mc", q:"Khả năng nào của AI cho phép máy tính điều chỉnh hành vi dựa trên dữ liệu mới?", o:["Khả năng suy luận","Khả năng học","Khả năng nhận thức","Khả năng giải quyết vấn đề"], a:1},
{l:"Bài 1", type:"mc", q:"Hệ thống nào sau đây là ví dụ về khả năng suy luận của AI?", o:["Hệ thống khuyến nghị YouTube","Hệ thống chẩn đoán y tế","Máy tính điều khiển xe tự lái","Công cụ tìm kiếm Google"], a:1},
{l:"Bài 1", type:"mc", q:"Khả năng nhận thức của AI là gì?", o:["Điều chỉnh hành vi dựa trên dữ liệu mới","Áp dụng logic để đưa ra quyết định","Cảm nhận và hiểu biết môi trường qua cảm biến","Xử lí ngôn ngữ tự nhiên"], a:2},
{l:"Bài 1", type:"mc", q:"AI khác biệt so với tự động hóa như thế nào?", o:["AI yêu cầu sự kết hợp của nhiều đặc trưng trí tuệ để thực hiện các nhiệm vụ phức tạp","AI chỉ thực hiện được một nhiệm vụ duy nhất","Tự động hóa không yêu cầu sự can thiệp của con người","Tự động hóa chỉ áp dụng trong lĩnh vực công nghiệp"], a:0},
{l:"Bài 1", type:"mc", q:"Trí tuệ nhân tạo được thiết kế để thực hiện nhiệm vụ nào sau đây?", o:["Tự học, thực hiện nhiều công việc giống con người","Chơi cờ và nhận dạng khuôn mặt","Chăm sóc sức khỏe","Dự báo thời tiết"], a:0},
{l:"Bài 1", type:"mc", q:"Hệ chuyên gia MYCIN được sử dụng trong lĩnh vực nào?", o:["Công nghiệp","Y học","Tài chính","Giáo dục"], a:1},
{l:"Bài 1", type:"mc", q:"Robot Asimo của Honda là ví dụ của ứng dụng AI trong lĩnh vực nào?", o:["Trò chơi điện tử","Dịch vụ khách hàng","Công nghiệp","Điều khiển robot"], a:3},
{l:"Bài 1", type:"mc", q:"Google Dịch là một ví dụ của khả năng nào trong AI?", o:["Khả năng học","Khả năng suy luận","Khả năng nhận thức","Khả năng hiểu ngôn ngữ"], a:3},
{l:"Bài 1", type:"tf", q:"Các phát biểu sau đây đúng hay sai khi nói về khái niệm và đặc trưng của AI:", items:[
{text:"a) AI là khả năng của máy tính thực hiện các công việc mang tính trí tuệ của con người.", a:true},
{text:"b) Mục đích của AI là xây dựng các phần mềm giúp máy tính có năng lực trí tuệ tương tự con người.", a:true},
{text:"c) Khả năng học của AI cho phép máy tính ra quyết định dựa trên dữ liệu mới.", a:false},
{text:"d) Khả năng nhận thức của AI là khả năng xử lí ngôn ngữ tự nhiên.", a:false}]},
{l:"Bài 1", type:"tf", q:"Phát biểu dưới đây đúng hay sai khi nói về các loại và ứng dụng của AI:", items:[
{text:"a) Trí tuệ nhân tạo hẹp được thiết kế để thực hiện nhiều nhiệm vụ phức tạp giống con người.", a:false},
{text:"b) Trí tuệ nhân tạo tổng quát là mục tiêu dài hạn, có khả năng tự học và thực hiện nhiều công việc giống con người.", a:true},
{text:"c) Hệ chuyên gia MYCIN được sử dụng để dự báo thời tiết.", a:false},
{text:"d) Robot Asimo của Honda là một ví dụ về ứng dụng AI trong điều khiển robot.", a:true}]},

// ===== BÀI 2 =====
{l:"Bài 2", type:"mc", q:"Lĩnh vực nào sau đây phát triển nhờ ứng dụng AI?", o:["Nông nghiệp","Chế biến thực phẩm","Phát triển người máy thông minh","Nghề thủ công"], a:2},
{l:"Bài 2", type:"mc", q:"AI giúp phát triển điều khiển tự động trong lĩnh vực nào?", o:["Nấu ăn tự động","Quản lý tài chính","Thiết bị bay không người lái","Đào tạo nhân sự"], a:2},
{l:"Bài 2", type:"mc", q:"Sản phẩm nào dưới đây không được phát triển nhờ AI?", o:["Nhận dạng vân tay","Điều hoà không khí tự động","Trợ lý ảo như Siri","Chatbot hỗ trợ khách hàng"], a:1},
{l:"Bài 2", type:"mc", q:"AI có thể được ứng dụng trong dịch vụ nào?", o:["Chẩn đoán bệnh bằng DeepMind","Sản xuất thuốc bằng máy móc","Dịch vụ vận chuyển hàng hóa","Dịch vụ sửa chữa ô tô"], a:0},
{l:"Bài 2", type:"mc", q:"Ứng dụng nào dưới đây liên quan đến AI trong y tế?", o:["Chẩn đoán bệnh bằng DeepMind","Sản xuất thuốc bằng máy móc","Vận hành bệnh viện tự động","Quản lý dược phẩm"], a:0},
{l:"Bài 2", type:"mc", q:"Một cảnh báo về ứng dụng AI là gì?", o:["Tăng cường bảo mật dữ liệu","Tạo ra nhiều việc làm mới","Đe dọa an ninh hệ thống","Giảm bớt sự phân biệt đối xử"], a:2},
{l:"Bài 2", type:"mc", q:"Lợi ích của AI trong giáo dục và đào tạo là gì?", o:["Tăng chi phí giáo dục","Cá nhân hoá học tập","Giảm chất lượng giảng dạy","Tăng áp lực cho học viên"], a:1},
{l:"Bài 2", type:"mc", q:"Công nghệ nào của Google Drive liên quan đến AI?", o:["Lưu trữ đám mây","Nhận dạng chữ viết tay (OCR)","Chỉnh sửa văn bản","Bảo mật dữ liệu"], a:1},
{l:"Bài 2", type:"mc", q:"AI có thể ảnh hưởng đến lĩnh vực tài chính như thế nào?", o:["Tạo ra sản phẩm mới","Phân tích hành vi tài chính để phát hiện gian lận","Quản lý quỹ đầu tư","Điều hành ngân hàng"], a:1},
{l:"Bài 2", type:"mc", q:"Giải pháp nào cần thiết để giám sát và đảm bảo an toàn trong phát triển AI?", o:["Tăng cường sự minh bạch","Giảm thiểu chi phí phát triển","Hạn chế nghiên cứu AI","Tăng cường sự phát triển của công nghệ"], a:0},
{l:"Bài 2", type:"tf", q:"Một số lĩnh vực phát triển nhờ ứng dụng AI đúng hay sai?", items:[
{text:"a) AI giúp phát triển người máy thông minh", a:true},
{text:"b) AI giúp phát triển điều khiển tự động", a:true},
{text:"c) AI giúp phát triển một số sản phẩm, tiện ích thông minh", a:true},
{text:"d) AI giúp phát triển các dịch vụ", a:true}]},
{l:"Bài 2", type:"tf", q:"Phát biểu sau đây đúng hay sai về cảnh báo ứng dụng AI?", items:[
{text:"a) AI có khả năng tự động hoá nhiều công việc, dẫn đến áp lực thất nghiệp", a:true},
{text:"b) Vi phạm quyền riêng tư khi dữ liệu cá nhân bị lạm dụng", a:true},
{text:"c) Đe dọa an ninh hệ thống khi bị tấn công xâm nhập hoặc thay đổi dữ liệu", a:true},
{text:"d) Có thể kiểm soát hoặc thay đổi ý thức, hành vi con người một cách không muốn", a:true}]},

// ===== BÀI 3 =====
{l:"Bài 3", type:"mc", q:"Thiết bị nào hoạt động tại tầng vật lý của mô hình OSI và chuyển tiếp dữ liệu đến tất cả các thiết bị:", o:["Hub","Switch","Router","Modem"], a:0},
{l:"Bài 3", type:"mc", q:"Thiết bị nào có khả năng chuyển tiếp dữ liệu chỉ đến thiết bị đích mà không phải gửi đến tất cả các thiết bị khác trong mạng?", o:["Hub","Switch","Router","Modem"], a:1},
{l:"Bài 3", type:"mc", q:"Thiết bị nào có chức năng dẫn đường cho dữ liệu khi kết nối trên mạng Internet?", o:["Hub","Switch","Router","Modem"], a:2},
{l:"Bài 3", type:"mc", q:"Thiết bị nào chuyển đổi tín hiệu từ tín hiệu số sang tín hiệu tương tự và ngược lại, thường dùng khi kết nối LAN với Internet?", o:["Hub","Switch","Router","Modem"], a:3},
{l:"Bài 3", type:"mc", q:"Bộ thu phát Wi-Fi còn được gọi là gì?", o:["Hub","Switch","Access Point","Modem"], a:2},
{l:"Bài 3", type:"mc", q:"Thiết bị nào sử dụng địa chỉ MAC để định tuyến dữ liệu trong mạng LAN?", o:["Hub","Switch","Router","Modem"], a:1},
{l:"Bài 3", type:"mc", q:"Để mở rộng phạm vi của một mạng LAN không dây, thiết bị nào thường được sử dụng?", o:["Hub","Switch","Router","Access Point"], a:3},
{l:"Bài 3", type:"mc", q:"Thiết bị nào thường có nhiều cổng WAN và được nhà cung cấp dịch vụ Internet sử dụng để chuyển dữ liệu?", o:["Hub","Switch","Router","Modem"], a:2},
{l:"Bài 3", type:"mc", q:"Trên thiết bị Android, làm thế nào để kết nối vào mạng Wi-Fi?", o:["Vuốt màn hình từ trên xuống, chọn biểu tượng cài đặt, sau đó chọn biểu tượng kết nối Wi-Fi","Nhấn nút Home ba lần liên tiếp","Vuốt màn hình từ dưới lên, chọn biểu tượng Bluetooth","Chọn biểu tượng mạng trên thanh trạng thái"], a:0},
{l:"Bài 3", type:"mc", q:"Nếu một trạm Wi-Fi có biểu tượng khóa, điều này có nghĩa là gì?", o:["Trạm không có kết nối Internet","Trạm yêu cầu mật khẩu để kết nối","Trạm chỉ cho phép các thiết bị có địa chỉ MAC cụ thể kết nối","Trạm không hoạt động"], a:1},
{l:"Bài 3", type:"tf", q:"Phát biểu sau đây đúng hay sai khi nói về thiết bị mạng thông dụng?", items:[
{text:"a) Hub hoạt động tại tầng vật lý của mạng và chuyển tiếp dữ liệu đến tất cả các thiết bị kết nối. Nguy cơ xung đột tín hiệu cao.", a:true},
{text:"b) Switch hoạt động tại tầng dữ liệu, có khả năng chuyển tiếp dữ liệu chỉ đến thiết bị đích mà không phải gửi đến tất cả các thiết bị khác trong mạng. Không gây xung đột với tín hiệu của các cuộc truyền ở cổng khác.", a:true},
{text:"c) Wi-Fi (Wireless Fidelity) truyền dữ liệu bằng sóng vô tuyến, phổ biến trong các mạng cục bộ.", a:true},
{text:"d) Để thiết lập một LAN đơn giản, ta có thể sử dụng bộ thu phát Wi-Fi để kết nối các thiết bị đầu cuối trong một khu vực mà không cần hub, switch hay cáp mạng.", a:true}]},
{l:"Bài 3", type:"tf", q:"Thực hành kết nối máy tính với các thiết bị mạng sau đây đúng hay sai?", items:[
{text:"a) Trên Windows 10 và 11, nhấp vào biểu tượng sóng trên thanh Taskbar để chọn và kết nối với trạm Wi-Fi gần.", a:true},
{text:"b) Trên Android, vuốt màn hình từ trên xuống, chọn biểu tượng cài đặt, sau đó chọn biểu tượng kết nối Wi-Fi.", a:true},
{text:"c) Trên iOS, vuốt màn hình từ trên xuống (hoặc từ dưới lên), chọn biểu tượng để xem danh sách các trạm Wi-Fi gần, bao gồm tên, trạng thái bảo mật và thông tin kết nối.", a:true},
{text:"d) Để kết nối thiết bị vào mạng LAN qua Wi-Fi, chọn trạm Wi-Fi thuộc LAN đó. Nếu trạm có biểu tượng khoá, yêu cầu nhập mật khẩu để kết nối. Sau khi nhập đúng, chọn Connect (hoặc Kết nối).", a:true}]},

// ===== BÀI 4 =====
{l:"Bài 4", type:"mc", q:"Giao thức mạng là gì?", o:["Phần cứng trong mạng","Tập hợp các quy định về cách thức giao tiếp trong mạng","Phần mềm dùng để kiểm tra bảo mật","Một loại thiết bị mạng"], a:1},
{l:"Bài 4", type:"mc", q:"Giao thức IP làm nhiệm vụ gì trong mạng?", o:["Xác định địa chỉ MAC cho các thiết bị","Chia dữ liệu thành các gói nhỏ","Thiết lập địa chỉ và dẫn đường các gói dữ liệu","Kiểm tra lỗi trong truyền dữ liệu"], a:2},
{l:"Bài 4", type:"mc", q:"Có bao nhiêu phiên bản địa chỉ IP chính?", o:["1","2","3","4"], a:1},
{l:"Bài 4", type:"mc", q:"Địa chỉ IP khác với địa chỉ MAC ở điểm nào?", o:["IP là địa chỉ phần cứng, MAC là địa chỉ logic","IP là địa chỉ tạm thời, MAC là địa chỉ cố định","IP là địa chỉ của giao diện mạng, MAC là địa chỉ của thiết bị vật lý","IP là địa chỉ trong mạng LAN, MAC là địa chỉ trong mạng WAN"], a:1},
{l:"Bài 4", type:"mc", q:"Router trong mạng đóng vai trò gì?", o:["Chia sẻ tài nguyên mạng","Chuyển tiếp bưu phẩm dữ liệu","Kiểm tra lỗi dữ liệu","Tạo và quản lý kết nối VPN"], a:1},
{l:"Bài 4", type:"mc", q:"Giao thức nào đảm bảo dữ liệu được truyền đến đúng ứng dụng và theo thứ tự?", o:["IP","TCP","UDP","HTTP"], a:1},
{l:"Bài 4", type:"mc", q:"Giao thức TCP cung cấp cơ chế gì để đảm bảo truyền dữ liệu tin cậy?", o:["Phát hiện và sửa lỗi","Chuyển đổi địa chỉ IP","Phân phối tài nguyên","Mã hóa dữ liệu"], a:0},
{l:"Bài 4", type:"mc", q:"Giao thức nào thường được sử dụng cùng với IP để quản lý kết nối và truyền dữ liệu trong Internet?", o:["FTP","SMTP","TCP","DHCP"], a:2},
{l:"Bài 4", type:"mc", q:"Giao thức nào không đảm bảo dữ liệu được truyền đúng thứ tự và có thể mất mát dữ liệu?", o:["IP","TCP","UDP","HTTP"], a:2},
{l:"Bài 4", type:"mc", q:"Trong mô hình OSI, giao thức IP hoạt động tại tầng nào?", o:["Tầng ứng dụng","Tầng truyền tải","Tầng mạng","Tầng liên kết dữ liệu"], a:2},
{l:"Bài 4", type:"tf", q:"Các phát biểu sau đúng hay sai về Giao thức IP và TCP?", items:[
{text:"a) Giao thức IP đảm bảo dữ liệu được truyền đến ứng dụng cụ thể trên máy.", a:false},
{text:"b) Có hai loại địa chỉ IP là IPv4 và IPv6.", a:true},
{text:"c) Địa chỉ IP và địa chỉ MAC là giống nhau.", a:false},
{text:"d) Router đóng vai trò như các bưu cục chuyển tiếp bưu phẩm.", a:true}]},
{l:"Bài 4", type:"tf", q:"Phát biểu sau đúng hay sai về Giao thức TCP?", items:[
{text:"a) Giao thức TCP chỉ đảm bảo chuyển dữ liệu giữa các mạng mà không đảm bảo truyền dữ liệu theo thứ tự.", a:false},
{text:"b) Giao thức TCP cung cấp cơ chế xác nhận gửi lại dữ liệu khi cần.", a:true},
{text:"c) TCP chia dữ liệu thành các gói để tận dụng đường truyền.", a:true},
{text:"d) TCP không phân biệt giữa các ứng dụng khác nhau khi truyền dữ liệu.", a:false}]},

{text:"b) Thiết lập chia sẻ thư mục công cộng.", a:true},
{text:"c) Bật tường lửa để bảo vệ an ninh mạng.", a:false},

{l:"Bài 5", type:"tf", q:"Quy trình kết nối máy in mạng từ các máy tính khác bao gồm các bước sau đúng hay sai?", items:[

let quizData=[],currentIndex=0,score=0,wrongAnswers=[],answered=false,tfDone=0;
const $=id=>document.getElementById(id);
const lessonNames=["Bài 1","Bài 2","Bài 3","Bài 4","Bài 5","Bài 6","Tham khảo","Đề minh họa"];
lessonNames.forEach(l=>{
  const n=allQuestions.filter(q=>q.l===l).length;
  if(n>0)$('lesson-list').innerHTML+=`<label class="lesson-checkbox"><input type="checkbox" value="${l}" checked> ${l} (${n} câu)</label>`;
});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){
  const sel=Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(c=>c.value);
  if(!sel.length){alert("Vui lòng chọn ít nhất 1 bài!");return}
  quizData=shuffle(allQuestions.filter(q=>sel.includes(q.l)).map(q=>{if(q.type!=='mc')return q;const c=q.o[q.a];const o=shuffle([...q.o]);return {...q,o:o,a:o.indexOf(c)}}));
  currentIndex=0;score=0;wrongAnswers=[];
  $('start-screen').style.display='none';$('quiz-screen').style.display='block';$('result-screen').style.display='none';
  renderQuestion();
}
function renderQuestion(){
  answered=false;tfDone=0;
  $('next-btn').style.display='none';$('feedback').innerHTML='';
  const q=quizData[currentIndex];
  $('progress-text').textContent=`Câu ${currentIndex+1}/${quizData.length} - ${q.l}`;
  $('question-text').textContent=q.q;
  const body=$('question-body');body.innerHTML='';
  if(q.type==='mc'){
    q.o.forEach((opt,i)=>{
      const b=document.createElement('button');b.className='option';
      b.textContent=String.fromCharCode(65+i)+'. '+opt;
      b.onclick=()=>selectMC(i,b);body.appendChild(b);
    });
  }else{
    q.items.forEach((item,idx)=>{
      const row=document.createElement('div');row.className='tf-row';
      const t=document.createElement('div');t.className='tf-text';t.textContent=item.text;
      const g=document.createElement('div');g.className='tf-btns';
      const bT=document.createElement('button');bT.className='tf-btn';bT.textContent='Đúng';
      const bF=document.createElement('button');bF.className='tf-btn';bF.textContent='Sai';
      bT.onclick=()=>selectTF(idx,true,bT,bF,item.a);
      bF.onclick=()=>selectTF(idx,false,bT,bF,item.a);
      g.appendChild(bT);g.appendChild(bF);row.appendChild(t);row.appendChild(g);body.appendChild(row);
    });
  }
}
function selectMC(i,btn){
  if(answered)return;answered=true;
  const q=quizData[currentIndex];
  const opts=document.querySelectorAll('.option');
  opts.forEach(o=>o.style.pointerEvents='none');
  if(i===q.a){
    btn.classList.add('correct');
    $('feedback').innerHTML='<span style="color:#28a745">✔ Chính xác!</span>';score++;
  }else{
    btn.classList.add('wrong');opts[q.a].classList.add('correct');
    $('feedback').innerHTML=`<span style="color:#dc3545">✘ Sai! Đáp án đúng: ${String.fromCharCode(65+q.a)}</span>`;
    wrongAnswers.push({q:q.q,correct:q.o[q.a]});
  }
  $('next-btn').style.display='block';
}
function selectTF(idx,isTrue,bT,bF,correct){
  if(answered)return;
  const ok=(isTrue===correct);
  const b=isTrue?bT:bF;
  b.classList.add(ok?'selected-true':'selected-false');
  b.textContent=(isTrue?'Đúng':'Sai')+(ok?' ✔':' ✘');
  bT.disabled=true;bF.disabled=true;
  if(ok)score++;
  else{const q=quizData[currentIndex];wrongAnswers.push({q:q.q+" - "+q.items[idx].text,correct:correct?"Đúng":"Sai"})}
  tfDone++;
  if(tfDone===quizData[currentIndex].items.length){
    answered=true;
    $('feedback').innerHTML='<span>Đã hoàn thành câu hỏi này.</span>';
    $('next-btn').style.display='block';
  }
}
function nextQuestion(){currentIndex++;if(currentIndex<quizData.length){renderQuestion();window.scrollTo(0,0)}else showResults()}
function showResults(){
  $('quiz-screen').style.display='none';$('result-screen').style.display='block';
  let total=0;quizData.forEach(q=>total+=q.type==='mc'?1:q.items.length);
  $('final-score').textContent=`Bạn đúng: ${score}/${total} ý`;
  const d=$('detailed-results');
  if(!wrongAnswers.length){d.innerHTML='<p style="text-align:center;color:#28a745;font-weight:bold">Tuyệt vời! Bạn làm đúng tất cả!</p>'}
  else{
    d.innerHTML='<h3>Chi tiết câu sai:</h3>';
    wrongAnswers.forEach(it=>{
      const div=document.createElement('div');div.className='wrong-item';
      const s=document.createElement('strong');s.textContent=it.q;
      const c=document.createElement('span');c.style.color='#28a745';c.textContent='Đáp án đúng: '+it.correct;
      div.appendChild(s);div.appendChild(document.createElement('br'));div.appendChild(c);d.appendChild(div);
    });
  }
}
</script>
